<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AllesBau — Arbeitsstunden & Lohnverwaltung</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0c1015">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AllesBau">
  <meta name="application-name" content="AllesBau">
  <meta name="description" content="Mobile-first Arbeitszeiterfassung, Live-Schichterfassung und Lohnverwaltung für AllesBau Bauunternehmen.">

  <!-- Favicon / Touch Icon — AllesBau Logo -->
  <link rel="icon" type="image/png" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.png">

  <!-- Instant Theme Initializer (prevents theme flicker) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('allesbau_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- jsPDF & AutoTable for 1-Page Monthly PDF Report Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#F5A623', // Matches new logo Bau & Hammer
              600: '#E09618',
              700: '#B87508',
              800: '#925B06',
              900: '#6E4204',
            },
            slatebrand: {
              50:  '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#455A64', // Matches new logo "alles" & lower roof
              700: '#37474F',
              800: '#263238',
              900: '#1A2228',
              950: '#0F151A',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-slate-50 dark:bg-[#0c1015] text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-black min-h-screen transition-colors duration-200">
  
  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-3 left-1/2 -translate-x-1/2 w-full max-w-[460px] px-4 z-50 pointer-events-none flex flex-col gap-2"></div>

  <!-- App Mount Root -->
  <div id="app-root"></div>

  <!-- App Logic -->
  <script src="./app.js"></script>
</body>
</html>
