<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#111111"/>
  <!-- House roof (gold) -->
  <polygon points="256,80 440,230 72,230" fill="#F5C000" stroke="#F5C000" stroke-linejoin="round"/>
  <!-- House body (dark) -->
  <rect x="130" y="225" width="252" height="185" rx="6" fill="#1a1a1a"/>
  <!-- House door -->
  <rect x="220" y="300" width="72" height="110" rx="8" fill="#F5C000"/>
  <!-- Window -->
  <rect x="306" y="270" width="52" height="48" rx="6" fill="#F5C000" opacity="0.9"/>
  <line x1="332" y1="270" x2="332" y2="318" stroke="#111" stroke-width="4"/>
  <line x1="306" y1="294" x2="358" y2="294" stroke="#111" stroke-width="4"/>
  <!-- Hammer handle -->
  <rect x="290" y="100" width="20" height="80" rx="8" transform="rotate(40,290,100)" fill="#aaaaaa"/>
  <!-- Hammer head -->
  <rect x="330" y="60" width="65" height="36" rx="10" transform="rotate(40,330,60)" fill="#cccccc"/>
</svg>
